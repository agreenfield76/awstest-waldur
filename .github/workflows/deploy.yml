name: Provision research EC2 (manual POC)
on:
  workflow_dispatch:
    inputs:
      instance_name:
        description: Instance name
        required: true
        default: waldur-poc-01
        type: string
      instance_type:
        description: Instance type
        type: choice
        options: [t3.micro, t3.small, t3.medium]
      resource_uuid:
        description: Unique state key / Waldur resource UUID
        required: true
        default: manual-test
        type: string
permissions:
  id-token: write
  contents: read
concurrency:
  group: ec2-${{ inputs.resource_uuid }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-poc
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Initialize state
        working-directory: terraform
        env:
          RESOURCE_UUID: ${{ inputs.resource_uuid }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          if ! [[ "$RESOURCE_UUID" =~ ^[a-zA-Z0-9-]{1,64}$ ]]; then exit 1; fi
          terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=waldur/${RESOURCE_UUID}/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="encrypt=true"
      - name: Plan and deploy
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_subnet_id: ${{ vars.AWS_SUBNET_ID }}
          TF_VAR_security_group_id: ${{ vars.AWS_SECURITY_GROUP_ID }}
          TF_VAR_instance_name: ${{ inputs.instance_name }}
          TF_VAR_instance_type: ${{ inputs.instance_type }}
          TF_VAR_waldur_resource_uuid: ${{ inputs.resource_uuid }}
        run: |
          terraform fmt -check
          terraform validate
          terraform plan -out=plan.tfplan
          terraform apply -auto-approve plan.tfplan
          terraform output -json > outputs.json
          echo '### EC2 deployment outputs' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat outputs.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ github.run_id }}
          path: terraform/outputs.json
          retention-days: 7
